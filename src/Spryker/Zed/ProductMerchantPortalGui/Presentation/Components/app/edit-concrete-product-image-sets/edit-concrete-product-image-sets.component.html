<ng-content></ng-content>

@if (images) {
    <div class="mp-edit-concrete-product-image-sets__images">
        @for (image of images; track image) {
            <div class="mp-edit-concrete-product-image-sets__image-container">
                <img [src]="image.src" [alt]="image.alt" class="mp-edit-concrete-product-image-sets__image" />
            </div>
        }
    </div>
}
